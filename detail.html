<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>왓츠 1기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Nanum+Brush+Script&display=swap">
<style>
/* Detail page: one winding road drawn top to bottom; timeline stops sit on its bends. */
:root { --bg: #ffffff; --fg: #2b2f22; --muted: #8b8f7a; --deep: #607829; --light: #a6af32; --sky: #5798D7; --line: #e6e9c6;
  --display: "Nanum Brush Script", cursive; --body: "Gowun Dodum", -apple-system, "Noto Sans KR", sans-serif; color-scheme: light; }
* { box-sizing: border-box; }
html, body { overflow-x: clip; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 48px; }
img { max-width: 100%; }
.top { display: flex; justify-content: flex-end; max-width: 1000px; margin: 0 auto; padding-block: 24px 0; }
.top img { height: 32px; width: auto; display: block; }
.title { text-align: center; padding-block: 8px 0; }
.title h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(44px, 8vw, 72px); color: var(--deep); line-height: 1; }
.title p { margin: 8px 0 0; color: var(--muted); font-size: 15px; }
.canvas { position: relative; max-width: 1000px; margin: -150px auto 0; aspect-ratio: 1000 / 3300; container-type: inline-size; }
.road { position: absolute; inset: 0; width: 100%; height: 100%; }
.stop { position: absolute; inset: 0; pointer-events: none; }
.stop > * { pointer-events: auto; }
.puzzle { position: absolute; left: var(--ph-x); top: var(--ph-y); width: var(--pw); }
.dot, .pip { position: absolute; border-radius: 50%; z-index: -1; }
.dot { width: 24%; aspect-ratio: 1; bottom: 16%; background: var(--light); }
.pip { width: 4%; aspect-ratio: 1; top: 14%; background: var(--sky); }
.left .dot { left: 7%; } .right .dot { left: 2%; }
.left .pip { right: 4%; } .right .pip { right: 6%; }
.stop:nth-of-type(2n) .dot { background: var(--sky); width: 20%; } .stop:nth-of-type(2n) .pip { background: var(--light); }
.puzzle-svg { display: block; width: 100%; height: auto; overflow: visible; }
.piece path { fill: #f3f5ea; stroke: #1d1d1b; stroke-width: 2; stroke-dasharray: 6 5; }
.piece text { font-family: var(--body); font-size: 17px; fill: var(--muted); text-anchor: middle; letter-spacing: .08em; }
.text { position: absolute; left: var(--tx-x); top: var(--tx-y); width: var(--tx-w); }
.eyebrow { margin: 0; font-size: max(12px, 1.3cqw); letter-spacing: .12em; color: var(--sky); font-weight: 700; }
.text h2 { margin: .3em 0 .35em; font-family: var(--display); font-weight: 400; font-size: max(26px, 3.6cqw); line-height: 1.1; color: var(--deep); text-wrap: balance; }
.hint { margin: 0 0 .9em; font-size: max(13px, 1.5cqw); color: var(--muted); }
.lines { display: grid; gap: max(8px, 1.1cqw); }
.lines i { display: block; height: max(7px, .8cqw); border-radius: 4px; background: var(--line); }
.back { display: flex; justify-content: center; margin-top: 8px; }
.back a { font-family: var(--body); color: var(--deep); text-decoration: none; border: 1.5px solid var(--deep); border-radius: 999px; padding: 10px 22px; font-size: 15px; }
.back a:hover, .back a:focus-visible { background: var(--deep); color: #fff; outline: none; }
/* Phones: the road becomes a simple line on the left and the stops stack. */
@media (max-width: 720px) {
  .canvas { aspect-ratio: auto; margin-top: 24px; display: grid; gap: 40px; padding-left: 34px; }
  .canvas::before { content: ""; position: absolute; left: 10px; top: 0; bottom: 0; width: 2px; background: #b3b6a6; transform: translateX(6px); }
  .road { display: none; }
  .stop { position: relative; inset: auto; display: grid; grid-template-columns: 1fr; gap: 14px; }
  .stop::before { content: attr(data-n); position: absolute; left: -32px; top: 4px; width: 22px; height: 22px; border-radius: 50%; background: var(--deep); color: #fff; font-size: 12px; display: grid; place-items: center; }
  .puzzle, .text { position: static; width: auto; }
  .puzzle { grid-column: 1 / -1; max-width: 340px; position: relative; left: auto; top: auto; z-index: 0; }
  .pip { display: none; }
  .text { grid-column: 1 / -1; min-width: 0; }
  .eyebrow, .hint { font-size: 13px; }
  .text h2 { font-size: 30px; }
  .lines i { height: 8px; }
}
</style>
</head>
